<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1322">
<title>M.I.R.A.D.A. · Micrófono del jurado</title>
<style>
  :root{
    --fondo:#0b1322; --fondo2:#13213a; --panel:#152440; --linea:#24395c;
    --texto:#eef2f7; --tenue:#93a4bd; --acento:#00b0d2; --verde:#5fce78;
    --rojo:#ef5350; --ambar:#f5b52a; --nivel:0;
    --anillo:var(--linea);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, var(--fondo2) 0%, var(--fondo) 60%);
    color:var(--texto);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;
  }
  main{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
       padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .marca{font-weight:800;letter-spacing:.06em;color:var(--acento)}
  .quien{background:var(--panel);border:1px solid var(--linea);border-radius:999px;
         padding:6px 14px;font-weight:700;font-size:15px}

  .escena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
          text-align:center;padding:18px 4px 10px}
  .anillo{position:relative;width:min(58vw,230px);aspect-ratio:1;border-radius:50%;
          display:grid;place-items:center;margin-bottom:26px}
  .anillo::before{content:"";position:absolute;inset:0;border-radius:50%;
          border:3px solid var(--anillo);transition:border-color .3s}
  .anillo::after{content:"";position:absolute;inset:14%;border-radius:50%;
          background:var(--anillo);opacity:calc(.10 + var(--nivel)*.55);
          transform:scale(calc(.85 + var(--nivel)*.35));transition:background .3s}
  .anillo svg{position:relative;z-index:1;width:34%;height:34%;color:var(--anillo);transition:color .3s}
  h1{margin:0 0 8px;font-size:clamp(24px,7vw,30px);line-height:1.15}
  .detalle{margin:0;color:var(--tenue);max-width:34ch}

  .nota{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--linea);
        color:var(--ambar);font-weight:600;font-size:15px;max-width:36ch}
  .acciones{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:17px 18px;cursor:pointer;
         transition:transform .08s,opacity .2s}
  button:active{transform:scale(.98)}
  .primario{background:var(--acento);color:#04131c}
  .peligro{background:var(--rojo);color:#fff}
  .secundario{background:var(--panel);color:var(--texto);border:1px solid var(--linea)}
  .texto{background:none;color:var(--tenue);padding:10px;font-weight:600;text-decoration:underline}
  .oculto{display:none !important}

  .profesor{margin-top:16px;background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:14px 16px}
  .profesor .etq{display:flex;justify-content:space-between;align-items:center;color:var(--tenue);
                 font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .pildora{padding:3px 10px;border-radius:999px;background:var(--linea);color:var(--texto);
           font-size:12px;letter-spacing:.02em}
  .profesor .preg{margin:10px 0 4px;color:var(--ambar);font-weight:600;font-size:15px}
  .profesor .sub{margin:0;font-size:17px;min-height:1.4em}

  footer{display:flex;justify-content:space-between;align-items:center;color:var(--tenue);font-size:12px;margin-top:14px}
  .punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rojo);margin-right:6px}
  .punto.ok{background:var(--verde)}

  .aviso{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px);
         background:var(--texto);color:var(--fondo);padding:12px 18px;border-radius:12px;font-weight:600;
         opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
  .aviso.ver{opacity:1;transform:translateX(-50%) translateY(0)}

  body[data-estado="listo"]     {--anillo:var(--acento)}
  body[data-estado="grabando"]  {--anillo:var(--rojo)}
  body[data-estado="enviando"]  {--anillo:var(--acento)}
  body[data-estado="otro"]      {--anillo:var(--ambar)}
  body[data-estado="respuesta"] {--anillo:var(--verde)}
  body[data-estado="calibrar"]  {--anillo:var(--ambar)}
  body[data-estado="error"]     {--anillo:var(--rojo)}
  body[data-estado="grabando"] .anillo::before{animation:latido 1.1s ease-in-out infinite}
  body[data-estado="enviando"] .anillo::before{border-top-color:transparent;animation:giro .9s linear infinite}
  @keyframes latido{50%{transform:scale(1.06);opacity:.7}}
  @keyframes giro{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body data-estado="inicio">
<main>
  <header>
    <div class="marca">M.I.R.A.D.A.</div>
    <div class="quien" id="quien">Jurado</div>
  </header>

  <section class="escena">
    <div class="anillo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/>
      </svg>
    </div>
    <h1 id="titulo">Conectando…</h1>
    <p class="detalle" id="detalle"></p>
    <p class="nota oculto" id="nota"></p>
  </section>

  <section class="acciones">
    <button id="btnActivar" class="primario oculto">Activar micrófono</button>
    <button id="btnTerminar" class="peligro oculto">Terminar y enviar</button>
    <button id="btnPedir" class="secundario oculto">Pedir la palabra</button>
    <button id="btnRegistrar" class="texto oculto">Registrar mi lugar</button>
  </section>

  <section class="profesor oculto" id="panelProfesor" aria-live="polite">
    <div class="etq"><span>Profesor MIRADA</span><span class="pildora" id="estadoProf">esperando</span></div>
    <p class="preg" id="profPregunta"></p>
    <p class="sub" id="profTexto"></p>
  </section>

  <footer>
    <span><span class="punto" id="punto"></span><span id="conexion">Sin conexión</span></span>
    <span id="sesion"></span>
  </footer>
</main>
<div class="aviso" id="aviso"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, serverTimestamp, Bytes }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnq1OZavOTquMPyLs_etqA0qystCd7rMI",
  authDomain: "oracles-99bc3.firebaseapp.com",
  projectId: "oracles-99bc3",
  storageBucket: "oracles-99bc3.firebasestorage.app",
  messagingSenderId: "785165056789",
  appId: "1:785165056789:web:9848cbcfff67db040d871c",
  measurementId: "G-SF0SMTX8M8"
};

// ---------- Parámetros del QR ----------
const P = new URLSearchParams(location.search);
const SID = P.get("s") || "";
const J = parseInt(P.get("j") || "0", 10);
const COLECCION = "mirada_sesiones";

// ---------- Interfaz ----------
const $ = id => document.getElementById(id);
const ui = {
  titulo: $("titulo"), detalle: $("detalle"), quien: $("quien"),
  nota: $("nota"), activar: $("btnActivar"), terminar: $("btnTerminar"), pedir: $("btnPedir"), registrar: $("btnRegistrar"),
  panel: $("panelProfesor"), estadoProf: $("estadoProf"), pregunta: $("profPregunta"), texto: $("profTexto"),
  punto: $("punto"), conexion: $("conexion"), sesion: $("sesion"), aviso: $("aviso"),
};
let tAviso;
function avisar(msg) {
  ui.aviso.textContent = msg;
  ui.aviso.classList.add("ver");
  clearTimeout(tAviso);
  tAviso = setTimeout(() => ui.aviso.classList.remove("ver"), 3200);
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} }

// ---------- Estado ----------
const S = {
  conectado: false, sesionActiva: true, micListo: false, error: "",
  grabando: false, enviando: false, calibrandoHasta: 0, sinMedidor: false,
  turno: null, profesor: null, yo: {}, ultimoTurno: null, pendiente: null,
};
let db, sesionRef, refYo;
const yo = datos => setDoc(refYo, datos, { merge: true }).catch(() => {});
let stream, ctx, analizador, buffer, rec, trozos = [];
let tInicio = 0, hablo = false, ultimaVoz = 0, ruido = null, maxRms = 0, enviarAlTerminar = true, turnoGrabado = null;
let vadTimer = null, historial = [];
let wakeLock = null;

function estadoVisual() {
  if (!SID || !J) return "error";
  if (S.error) return "error";
  if (!S.sesionActiva) return "error";
  if (S.grabando) return "grabando";
  if (S.enviando) return "enviando";
  if (performance.now() < S.calibrandoHasta) return "calibrar";
  const t = S.turno;
  if (t && t.estado === "escuchar" && t.jurado && t.jurado !== J) return "otro";
  const pr = S.profesor;
  if (pr && pr.jurado === J && (pr.estado === "pensando" || pr.estado === "hablando")) return "respuesta";
  return S.micListo ? "listo" : "inicio";
}

function render() {
  const e = estadoVisual();
  document.body.dataset.estado = e;
  ui.quien.textContent = J ? `Jurado ${J}` : "Jurado";
  let titulo = "", detalle = "";
  if (!SID || !J) {
    titulo = "Escanee su código QR";
    detalle = "Abra esta página escaneando el código que aparece en la pantalla del profesor.";
  } else if (S.error) {
    titulo = "No se puede usar el micrófono";
    detalle = S.error;
  } else if (!S.sesionActiva) {
    titulo = "La sesión terminó";
    detalle = "Escanee el código nuevo que aparece en la pantalla del profesor.";
  } else if (e === "grabando") {
    titulo = "Le escucho…";
    detalle = S.sinMedidor
      ? "Haga su pregunta y toque «Terminar y enviar» cuando acabe."
      : "Haga su pregunta con naturalidad. Se envía sola cuando deje de hablar.";
  } else if (e === "enviando") {
    titulo = "Enviando su pregunta…";
    detalle = "El profesor la recibirá en un momento.";
  } else if (e === "calibrar") {
    titulo = "Levante la mano";
    detalle = "Manténgala arriba unos segundos frente al Kinect para que el sistema aprenda dónde está sentado.";
  } else if (e === "otro") {
    titulo = `Turno del Jurado ${S.turno.jurado}`;
    detalle = "Cuando termine, puede levantar la mano para preguntar.";
  } else if (e === "respuesta") {
    titulo = "El profesor le responde";
    detalle = "Escuche la respuesta en la pantalla. Puede leerla abajo.";
  } else if (e === "listo") {
    titulo = "Listo para preguntar";
    detalle = "Levante la mano frente al Kinect. Cuando el profesor le dé la palabra, este teléfono se activará solo.";
  } else {
    titulo = `Bienvenido, Jurado ${J}`;
    detalle = "Active el micrófono una sola vez. Solo se escucha cuando el profesor le da la palabra.";
  }
  ui.titulo.textContent = titulo;
  ui.detalle.textContent = detalle;

  // Modo clase: preguntas al final y cuántas le quedan a este jurado
  const cl = S.profesor && S.profesor.clase;
  let nota = "";
  if (cl && SID && J && S.sesionActiva && e !== "grabando" && e !== "enviando") {
    const lim = cl.limite || 2;
    const usadas = (cl.usadas || {})["j" + J] || 0;
    const quedan = Math.max(0, lim - usadas);
    const pos = (cl.cola || []).indexOf(J);
    if (["generando", "sintetizando", "explicando"].includes(cl.fase)) {
      nota = `Clase en curso: «${cl.titulo}». Las preguntas son al final, ${lim} por jurado.`;
      if (pos >= 0) nota += " Usted ya está en la lista.";
    } else if (cl.fase === "preguntas") {
      nota = quedan > 0
        ? `Ronda de preguntas: le ${quedan === 1 ? "queda" : "quedan"} ${quedan} de ${lim}.`
        : `Ya hizo sus ${lim} preguntas. ¡Gracias!`;
      if (pos >= 0) nota += ` Usted es el número ${pos + 1} de la lista.`;
    }
  }
  ui.nota.textContent = nota;
  ui.nota.classList.toggle("oculto", !nota);

  const valido = SID && J && S.sesionActiva && !S.error;
  ui.activar.classList.toggle("oculto", !(valido && !S.micListo));
  ui.activar.textContent = S.pendiente ? "Activar micrófono y hablar" : "Activar micrófono";
  ui.terminar.classList.toggle("oculto", e !== "grabando");
  const libre = valido && S.micListo && (e === "listo" || e === "respuesta");
  ui.pedir.classList.toggle("oculto", !libre);
  ui.registrar.classList.toggle("oculto", !libre);
  ui.registrar.textContent = S.yo && S.yo.registrado ? "Lugar registrado ✓ (volver a registrar)" : "Registrar mi lugar";

  const pr = S.profesor;
  const mostrarPanel = valido && pr && (pr.texto || pr.pregunta || pr.estado !== "espera");
  ui.panel.classList.toggle("oculto", !mostrarPanel);
  if (pr) {
    const etiquetas = { espera: "esperando", escuchando: "escuchando", pensando: "pensando", hablando: "hablando" };
    ui.estadoProf.textContent = etiquetas[pr.estado] || pr.estado || "";
    ui.pregunta.textContent = pr.pregunta ? `Pregunta: ${pr.pregunta}` : "";
    ui.texto.textContent = pr.estado === "pensando" ? "Pensando…" : (pr.texto || "");
  }
  ui.punto.classList.toggle("ok", S.conectado);
  ui.conexion.textContent = S.conectado ? "Conectado" : "Sin conexión";
  ui.sesion.textContent = SID ? `Sesión ${SID.slice(0, 4)}…` : "";
}

// ---------- Firebase ----------
function iniciarFirebase() {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  sesionRef = doc(db, COLECCION, SID);
  refYo = doc(db, COLECCION, SID, "jurados", `j${J}`);

  yo({ conectado: true, mic: false, visto: serverTimestamp(), equipo: navigator.userAgent.slice(0, 120) });
  // Latido: le dice al profesor que este teléfono sigue con la página abierta
  setInterval(() => { if (!document.hidden) yo({ conectado: true, visto: serverTimestamp() }); }, 20000);
  addEventListener("pagehide", () => yo({ conectado: false }));

  onSnapshot(sesionRef, { includeMetadataChanges: true }, snap => {
    S.conectado = !snap.metadata.fromCache;
    const v = snap.data();
    S.sesionActiva = !!(v && v.activa !== false);
    S.profesor = v ? v.profesor : null;
    manejarTurno(v ? v.turno : null);
  }, () => { S.error = "No hay permiso para leer la sesión. Revise las reglas de Firestore."; render(); });
  onSnapshot(refYo, snap => { S.yo = snap.data() || {}; render(); });
}

function manejarTurno(t) {
  S.turno = t;
  const mio = t && t.estado === "escuchar" && t.jurado === J;
  if (mio && t.id !== S.ultimoTurno) {
    S.ultimoTurno = t.id;
    if (S.micListo) iniciarGrabacion(t.id);
    else { S.pendiente = t.id; vibrar([200, 100, 200]); avisar("El profesor le dio la palabra: active el micrófono"); }
  } else if (!mio) {
    S.pendiente = null;
    if (S.grabando) detener(false);            // el profesor canceló el turno
  }
  render();
}

// ---------- Micrófono ----------
async function activarMic() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    S.error = "Esta página debe abrirse con https para usar el micrófono.";
    render(); return;
  }
  // El contexto de audio se crea DENTRO del toque: iPhone lo deja suspendido si se crea después.
  try {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume().catch(() => {});
  } catch (_) { ctx = null; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    if (ctx) {
      const fuente = ctx.createMediaStreamSource(stream);
      analizador = ctx.createAnalyser();
      analizador.fftSize = 1024;
      buffer = new Float32Array(analizador.fftSize);
      fuente.connect(analizador);
    }
    S.micListo = true;
    yo({ mic: true, conectado: true, visto: serverTimestamp() });
    pedirWakeLock();
    // setInterval sigue corriendo aunque el navegador no esté pintando cuadros
    if (!vadTimer) vadTimer = setInterval(vad, 50);
    if (S.pendiente) { const id = S.pendiente; S.pendiente = null; iniciarGrabacion(id); }
    else avisar("Micrófono listo");
  } catch (e) {
    S.error = "Permita el acceso al micrófono en su navegador y recargue la página.";
  }
  render();
}

// Cualquier toque reactiva el audio si el navegador lo suspendió
document.addEventListener("pointerdown", () => {
  if (ctx && ctx.state !== "running") ctx.resume().catch(() => {});
}, { passive: true });

function elegirMime() {
  if (!window.MediaRecorder) return null;
  for (const m of ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4", "audio/webm"]) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return "";
}

function iniciarGrabacion(id) {
  const mime = elegirMime();
  if (mime === null) { S.error = "Este navegador no puede grabar audio. Use Chrome o Safari actualizados."; render(); return; }
  if (ctx && ctx.state === "suspended") ctx.resume();
  trozos = []; hablo = false; ruido = null; maxRms = 0; ultimaVoz = 0; enviarAlTerminar = true;
  historial = [];
  S.sinMedidor = false;
  turnoGrabado = id;
  rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
  rec.ondataavailable = e => { if (e.data && e.data.size) trozos.push(e.data); };
  rec.onstop = () => finalizar(rec.mimeType || mime || "audio/webm");
  rec.start(250);
  tInicio = performance.now();
  S.grabando = true;
  yo({ grabando: id });                     // le confirma al profesor que ya está grabando
  vibrar([60, 40, 60]);
  render();
}

function detener(enviar) {
  if (!S.grabando) return;
  S.grabando = false;
  enviarAlTerminar = enviar;
  try { rec.stop(); } catch (_) {}
  render();
}

async function finalizar(mime) {
  yo({ grabando: 0 });
  if (!enviarAlTerminar) { render(); return; }
  const dur = (performance.now() - tInicio) / 1000;
  const preguntas = collection(sesionRef, "preguntas");
  try {
    if (!trozos.length) {
      await addDoc(preguntas, { jurado: J, turno: turnoGrabado, vacio: true, estado: "pendiente", creado: serverTimestamp() });
      avisar("No se grabó audio. Puede volver a levantar la mano.");
      return;
    }
    // Se envía siempre lo grabado: si de verdad no hubo voz, Gemini pide repetir la pregunta.
    S.enviando = true; render();
    const blob = new Blob(trozos, { type: mime });
    const audio = Bytes.fromUint8Array(new Uint8Array(await blob.arrayBuffer()));
    await addDoc(preguntas, { jurado: J, turno: turnoGrabado, audio, mime: mime.split(";")[0], voz: hablo,
                              dur: Math.round(dur * 10) / 10, estado: "pendiente", creado: serverTimestamp() });
  } catch (e) {
    avisar("No se pudo enviar el audio. Revise su conexión.");
  } finally {
    S.enviando = false; render();
  }
}

// Nivel del micrófono (null si el navegador no deja medirlo)
function leerNivel() {
  if (!analizador || !ctx || ctx.state !== "running") return null;
  analizador.getFloatTimeDomainData(buffer);
  let suma = 0;
  for (let i = 0; i < buffer.length; i++) suma += buffer[i] * buffer[i];
  return Math.sqrt(suma / buffer.length);
}

// Detección de fin de la pregunta, adaptada al ruido del lugar
function vad() {
  const rms = leerNivel();
  document.documentElement.style.setProperty("--nivel", S.grabando && rms ? Math.min(1, rms * 14).toFixed(3) : 0);
  if (S.calibrandoHasta && performance.now() > S.calibrandoHasta) { S.calibrandoHasta = 0; render(); }
  if (!S.grabando) return;
  const t = (performance.now() - tInicio) / 1000;
  if (rms !== null) {
    maxRms = Math.max(maxRms, rms);
    // Piso de ruido = percentil 15 de los últimos 3 s: se adapta a ventiladores o gente de fondo
    historial.push(rms);
    if (historial.length > 60) historial.shift();
    const orden = [...historial].sort((x, y) => x - y);
    ruido = Math.max(0.001, orden[Math.floor(orden.length * 0.15)]);
    const umbralVoz = Math.max(0.006, ruido * 2.8);
    const umbralSilencio = Math.max(0.004, ruido * 1.6);
    if (rms > umbralVoz) { hablo = true; ultimaVoz = t; }
    else if (hablo && rms > umbralSilencio) ultimaVoz = t;          // sigue dentro de la frase
    if (t > 0.6 && hablo && t - ultimaVoz > 0.9) { detener(true); return; }
  }
  const sinMedidor = rms === null || (t > 1.5 && maxRms === 0);
  if (sinMedidor !== S.sinMedidor) { S.sinMedidor = sinMedidor; render(); }
  if (!hablo && t > (sinMedidor ? 10 : 8)) { detener(true); return; }
  if (t > 14) detener(true);
}

async function pedirWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.micListo) pedirWakeLock();
});

// ---------- Botones ----------
ui.activar.addEventListener("click", activarMic);
ui.terminar.addEventListener("click", () => detener(true));
ui.pedir.addEventListener("click", () => {
  yo({ pide: serverTimestamp() });
  vibrar(40);
  avisar("Solicitud enviada al profesor");
});
ui.registrar.addEventListener("click", () => {
  yo({ calibrar: serverTimestamp() });
  S.calibrandoHasta = performance.now() + 10000;
  vibrar(40);
  render();
});

// ---------- Inicio ----------
render();
if (SID && J) {
  try { iniciarFirebase(); }
  catch (e) { S.error = "No se pudo conectar con Firebase."; render(); }
}
</script>
</body>
